<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Page</title>
</head>
<body>
    
    <form id="detailForm" action="/details" method="post">
        <label for="in">Sign In</label>
        <input type="radio" id="in" name="sign" value="in" required>
        <label for="up">Sign Up</label>
        <input type="radio" id="up" name="sign" value="up" required><br>
        
        Email
        <input type="email" id="email" name="email" required><br>
        Password
        <input type="password" id="pass" name="pass" required><br>
        <input type="submit" value="Submit">
    </form>
    <p id="errorMessage" style="color: red;">X</p>
    <script type="module" src="src/auth.js"></script>
</body>
</html>
